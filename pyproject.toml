[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "realtimecoin"
version = "0.1.0"
description = "Real-time (sequential) COIN motor-learning model, translated from MATLAB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
authors = [{name="Richard Marques Monteiro", email="rm967@cam.ac.uk"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
urls = {Repository = "https://github.com/RichieRich2569/real_time_md_coin"}
keywords = ["COIN", "contextual inference", "motor learning", "particle filter", "Bayesian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["realtimecoin*"]

[tool.setuptools.package-data]
realtimecoin = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the validation/ namespace package importable when pytest is run from
# the repo root (it is excluded from the wheel, so it is not on sys.path otherwise).
pythonpath = ["."]
markers = [
    "slow: marks tests that take a long time to run",
    "validation: marks scientific validation tests against the MATLAB reference",
    "statistical: marks seeded statistical tests (moments, KS goodness-of-fit)",
]
